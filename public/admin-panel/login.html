<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillMesh Admin — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
</head>
<body class="login-body">

<div class="login-card">
  <h4 class="mb-1">SkillMesh Admin</h4>
  <p class="text-muted small mb-4">Restricted access — admin accounts only.</p>

  <div id="error-alert" class="alert alert-danger d-none"></div>

  <form id="login-form">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100" id="login-btn">Log in</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="js/admin-api.js"></script>
<script>
$(function () {
  // If already logged in as admin, skip straight to the dashboard instead
  // of showing the login form again.
  const existingToken = localStorage.getItem('admin_token');
  if (existingToken) {
    window.location.href = 'dashboard.html';
  }

  $('#login-form').on('submit', function (e) {
    e.preventDefault();
    $('#error-alert').addClass('d-none');
    $('#login-btn').prop('disabled', true).text('Logging in...');

    $.ajax({
      url: API_BASE + '/login',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({
        email: $('#email').val(),
        password: $('#password').val(),
      }),
    })
      .done(function (response) {
        // Being logged in isn't enough — confirm is_admin before letting
        // them into the panel. A valid, non-admin login still fails here
        // on purpose, matching the same rule the backend enforces.
        if (!response.user.is_admin) {
          $('#error-alert').text('This account does not have admin access.').removeClass('d-none');
          $('#login-btn').prop('disabled', false).text('Log in');
          return;
        }
        localStorage.setItem('admin_token', response.token);
        window.location.href = 'dashboard.html';
      })
      .fail(function (xhr) {
        const message = xhr.responseJSON?.message || 'Login failed. Check your credentials.';
        $('#error-alert').text(message).removeClass('d-none');
        $('#login-btn').prop('disabled', false).text('Log in');
      });
  });
});
</script>
</body>
</html>
