<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillMesh Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1">SkillMesh Admin</span>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Log out</button>
</nav>

<div class="container-fluid mt-4 px-4">

  <ul class="nav nav-tabs mb-4" id="admin-tabs">
    <li class="nav-item"><button class="nav-link active" data-tab="overview">Overview</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="suppliers">Suppliers</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="skills">Skills</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="users">Users</button></li>
  </ul>

  <!-- OVERVIEW TAB -->
  <div class="tab-pane" id="tab-overview">
    <div class="row g-3" id="stats-cards">
      <!-- filled in by dashboard.js -->
    </div>
  </div>

  <!-- SUPPLIERS TAB -->
  <div class="tab-pane d-none" id="tab-suppliers">
    <div id="suppliers-alert" class="alert d-none"></div>
    <table class="table table-hover bg-white">
      <thead>
        <tr>
          <th>Business</th>
          <th>Contact</th>
          <th>Service Area</th>
          <th>Rate/L</th>
          <th>Tankers</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="suppliers-table-body"></tbody>
    </table>
  </div>

  <!-- SKILLS TAB -->
  <div class="tab-pane d-none" id="tab-skills">
    <button class="btn btn-primary btn-sm mb-3" data-bs-toggle="modal" data-bs-target="#skill-modal">
      + Add Skill
    </button>
    <div id="skills-alert" class="alert d-none"></div>
    <table class="table table-hover bg-white">
      <thead>
        <tr><th>Name</th><th>Category</th><th></th></tr>
      </thead>
      <tbody id="skills-table-body"></tbody>
    </table>
  </div>

  <!-- USERS TAB -->
  <div class="tab-pane d-none" id="tab-users">
    <table class="table table-hover bg-white">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Phone</th><th>Admin?</th><th>Joined</th></tr>
      </thead>
      <tbody id="users-table-body"></tbody>
    </table>
  </div>

</div>

<!-- Add/Edit Skill Modal -->
<div class="modal fade" id="skill-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Skill</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="skill-modal-error" class="alert alert-danger d-none"></div>
        <input type="hidden" id="skill-id">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" id="skill-name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <input type="text" class="form-control" id="skill-category" placeholder="e.g. Programming">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="skill-save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
